<!DOCTYPE html>
<html>
    <head>
        <style>
            #room-list{
                width: 10%;

                display: flex;
                flex-direction: column;
            }
        </style>
    </head>
    <body>
        <div id="lobby">
            <div id="room-list"></div>
            <button id="create-room">Create Room</button>
        </div>

        <div id="room" style="display:none;">
            <h2>Room Code: <span id="room-code"></span></h2>
            <button id="start-game">Start Game</button>
            <button id="leave-room">Leave Room</button>
        </div>

        <div id="game" style="display:none;">
            <div id="submission-phase">
                <h2>Game in progress...</h2>
                <p>You are a <span id="role"></span>.<p>

                <input type="radio" id="choose-peek" name="action-mode" value="peek">
                <label for="choose-peek">Peek</label>
                
                <div id="peek-options" style="display:none;"></div>
                
                <br>

                <input type="radio" id="choose-travel" name="action-mode" value="travel">
                <label for="choose-travel">Travel</label>

                <div id="destination-options" style="display:none;"></div>
                <div id="departure-options" style="display:none">
                    <label><input type="radio" name="departure-time" value="early">Depart Early</label>
                    <label><input type="radio" name="departure-time" value="late">Depart Late</label>
                </div>
                
                <br><br>

                <button id="submit-decision">Submit Decision</button>

                <hr>

                <button id="end-game">End Game</button>
            </div>

            <div id="simulation-phase" style="display: none"></div>
        </div>

        <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
        <script src="{{ url_for('static', filename='game.js') }}"></script>
    </body>
</html>
